name: Build Gam3ety APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Fix NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
      - name: Create App
        run: |
          flutter create . --platforms=android --org com.gam3ety.app --project-name gam3ety --overwrite
          mkdir -p lib/models
          cat > lib/models/gam3eya.dart << 'ENDDART'
          class Participant { String name; int dailyAmount; Participant({required this.name, required this.dailyAmount}); }
          class Share { String id; String type; String? ownerName; int totalAmount; int payoutOrder; List<Participant> participants; Share({required this.id, required this.type, this.ownerName, required this.totalAmount, required this.payoutOrder, this.participants = const []}); }
          class Gam3eya { String id; String name; int amount; int duration; List<Share> shares; Gam3eya({required this.id, required this.name, required this.amount, required this.duration, this.shares = const []}); int get totalPool => amount * duration; }
          ENDDART
          
          cat > lib/main.dart << 'ENDDART'
          import 'package:flutter/material.dart';
          import 'models/gam3eya.dart';
          void main() => runApp(const Gam3etyApp());
          class Gam3etyApp extends StatelessWidget {
            const Gam3etyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(title: 'جمعيتي', debugShowCheckedModeBanner: false, home: const HomeScreen());
            }
          }
          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            List<Gam3eya> list = [];
            @override
            void initState() {
              super.initState();
              list.add(Gam3eya(id: '1', name: 'جمعية 100 يوم', amount: 100, duration: 100, shares: [
                Share(id: 's1', type: 'single', ownerName: 'مصطفى', totalAmount: 100, payoutOrder: 1),
                Share(id: 's2', type: 'shared', totalAmount: 100, payoutOrder: 2, participants: [
                  Participant(name: 'أحمد', dailyAmount: 50),
                  Participant(name: 'محمد', dailyAmount: 30),
                  Participant(name: 'علي', dailyAmount: 20),
                ]),
              ]));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('جمعيتي'), backgroundColor: const Color(0xFF065f46)),
                body: ListView.builder(
                  itemCount: list.length,
                  itemBuilder: (context, idx) {
                    final g = list[idx];
                    return Card(
                      margin: const EdgeInsets.all(12),
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(g.name, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                            Text('${g.amount}ج × ${g.duration} = ${g.totalPool}ج'),
                            const Divider(),
                            for (var s in g.shares)
                              if (s.type == 'single')
                                ListTile(title: Text(s.ownerName ?? ''), subtitle: Text('دور ${s.payoutOrder}'))
                              else
                                Container(
                                  padding: const EdgeInsets.all(12),
                                  decoration: BoxDecoration(border: Border.all(color: Colors.amber, width: 2), borderRadius: BorderRadius.circular(12)),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text('سهم مشترك ${s.totalAmount}ج - دور ${s.payoutOrder}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                      const SizedBox(height: 8),
                                      for (var p in s.participants)
                                        Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: [
                                            Text('${p.name}: ${p.dailyAmount}ج'),
                                            Text('يقبض ${p.dailyAmount * g.duration}ج', style: const TextStyle(fontWeight: FontWeight.bold)),
                                          ],
                                        ),
                                    ],
                                  ),
                                ),
                          ],
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }
          ENDDART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: gam3ety-apk
          path: build/app/outputs/flutter-apk/app-release.apk
